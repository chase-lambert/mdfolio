[package]
name = "mdfolio"
version = "0.1.0"
edition = "2024"
description = "A quiet local library for the Markdown already in your repositories"
license = "MIT"
repository = "https://github.com/chase-lambert/mdfolio"
rust-version = "1.88"

[dependencies]
ammonia = "4.1.4"
askama = "0.16.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
comrak = { version = "0.54.0", default-features = false, features = ["syntect-fancy"] }
ignore = "0.4.31"
percent-encoding = "2.3.2"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "signal"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }
