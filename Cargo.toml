[package]
name = "mdfolio"
version = "0.1.0"
edition = "2024"
description = "A quiet local library for the Markdown already in your repositories"
license = "MIT"
repository = "https://github.com/chase-lambert/mdfolio"
rust-version = "1.88"

[dependencies]
ammonia = "4.1.4"
anyhow = "1.0.100"
askama = "0.16.0"
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
comrak = { version = "0.54.0", default-features = false, features = ["syntect-fancy"] }
ignore = "0.4.31"
mime_guess = "2.0.5"
notify = "8.2.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webbrowser = "1.2.1"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }
